<svg id="Layer_2" data-name="Layer 2" xmlns="http://www.w3.org/2000/svg" viewBox="-2 -14 64 96">
  <defs>
    <style>
      .cls-1 {
        fill: #4b4b4d;
      }

      .cls-2 {
        fill-rule: evenodd;
      }

      .cls-2, .cls-3 {
        fill: #0ea2c3;
      }

      .cls-4 {
        fill: #fff;
      }

      #Layer_1-2 > g {
        transform-box: fill-box;
        transform-origin: center;
        animation: logo-float 4s ease-in-out infinite;
      }

      #Layer_1-2 > g > path:nth-of-type(-n+4) {
        transform-box: fill-box;
        transform-origin: center;
        animation: icon-bob 2.8s ease-in-out infinite;
      }

      #Layer_1-2 > g > path:nth-of-type(2) { animation-delay: -0.45s; }
      #Layer_1-2 > g > path:nth-of-type(3) { animation-delay: -0.9s; }
      #Layer_1-2 > g > path:nth-of-type(4) { animation-delay: -1.35s; }

      #Layer_1-2 > g > path.cls-3 {
        animation: blue-pulse 3.2s ease-in-out infinite;
      }

      @keyframes logo-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      @keyframes icon-bob {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        35% { transform: translateY(-5px) rotate(-4deg); }
        70% { transform: translateY(2px) rotate(4deg); }
      }

      @keyframes blue-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }

      @media (prefers-reduced-motion: reduce) {
        #Layer_1-2 > g,
        #Layer_1-2 > g > path { animation: none !important; }
      }
    </style>
  </defs>
